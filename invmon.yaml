substitutions:
  name: invmon
  pip_update_interval: 500ms

esphome:
  name: ${name}
  friendly_name: Inverter Monitor
  comment: "EASun iGrid-IV-5.6kw Inverter RS232 monitoring."

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
  # - source:
  #     type: git
  #     url: https://github.com/maquowicz/esphome-pipsolar.git
  #     ref: pi18
  #   components: [pipsolar]
  #   refresh: 1s

# Enable logging
logger:
  level: DEBUG
  #level: INFO
  baud_rate: 0 # disable UART logs
  logs:
    component: ERROR

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  # fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  #use_address: 192.168.0.197 # override for ota if hostname changes

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${name} Hotspot"
    password: !secret wifi_fallback_password

captive_portal:

# time:
#   - platform: homeassistant
#     id: hass_time

uart:
  - id: uart_ch1
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 2400
    # debug: # this wipes out uart read buffer 
    #  direction: BOTH
    #  #dummy_receiver: true
    #  after:
    #    delimiter: "\r"
    #  sequence:
    #    - lambda: UARTDebug::log_string(direction, bytes);

  - id: uart_ch2
    tx_pin: GPIO19
    rx_pin: GPIO18
    baud_rate: 2400
    # debug: # this wipes out uart read buffer 
    #  direction: BOTH
    #  #dummy_receiver: true
    #  after:
    #    delimiter: "\r"
    #  sequence:
    #    - lambda: UARTDebug::log_string(direction, bytes);

  - id: uart_ch3
    tx_pin: GPIO17
    rx_pin: GPIO16 
    baud_rate: 2400
    # debug: # this wipes out uart read buffer 
    #  direction: BOTH
    #  #dummy_receiver: true
    #  after:
    #    delimiter: "\r"
    #  sequence:
    #    - lambda: UARTDebug::log_string(direction, bytes);

#   - id: uart_ch4
#     tx_pin: GPIO32
#     rx_pin: GPIO33
#     baud_rate: 9600
#     debug: # this wipes out uart read buffer 
#      direction: BOTH
#      #dummy_receiver: true
#      after:
#        delimiter: "\r"
#      sequence:
#        - lambda: UARTDebug::log_string(direction, bytes);

pipsolar:
  - uart_id: uart_ch1
    id: inverter1
    update_interval: ${pip_update_interval}

  - uart_id: uart_ch2
    id: inverter2
    update_interval: ${pip_update_interval}

  - uart_id: uart_ch3
    id: inverter3
    update_interval: ${pip_update_interval}

<<: !include invmon/small.yaml
